services:
  db-primary:
    image: postgres:16-alpine
    container_name: tp8-db-primary
    environment:
      POSTGRES_DB: tp8
      POSTGRES_USER: tp8
      POSTGRES_PASSWORD: tp8
    ports:
      - "5432:5432"
    volumes:
      - pg_primary:/var/lib/postgresql/data
      - ./scripts/init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp8 -d tp8"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-replica:
    image: postgres:16-alpine
    container_name: tp8-db-replica
    depends_on:
      db-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: tp8
      POSTGRES_USER: tp8
      POSTGRES_PASSWORD: tp8
    ports:
      - "5433:5432"
    volumes:
      - pg_replica:/var/lib/postgresql/data
      - ./scripts/entrypoint-replica.sh:/scripts/entrypoint-replica.sh:ro
    entrypoint: ["/bin/sh", "/scripts/entrypoint-replica.sh"]
    command: >
      postgres
      -c hot_standby=on
      -c listen_addresses=*

volumes:
  pg_primary:
  pg_replica:
